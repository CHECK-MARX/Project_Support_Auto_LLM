name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore SupportCaseManager.slnx

      - name: Build
        run: dotnet build SupportCaseManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SupportCaseManager.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

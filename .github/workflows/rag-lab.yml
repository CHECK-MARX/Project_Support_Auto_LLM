name: RAG Lab

on:
  push:
    paths:
      - "tools/rag-lab/**"
      - ".github/workflows/rag-lab.yml"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths:
      - "tools/rag-lab/**"
      - ".github/workflows/rag-lab.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test and verify synthetic RAG evaluation
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/rag-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/rag-lab/requirements.txt

      - name: Install test dependency
        run: python -m pip install --requirement requirements.txt

      - name: Unit tests
        run: python -m pytest

      - name: Synthetic quality gate
        run: python run_rag_lab.py verify

name: RAG Lab

on:
  push:
    paths:
      - "tools/rag-lab/**"
      - ".github/workflows/rag-lab.yml"
      - ".gitattributes"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths:
      - "tools/rag-lab/**"
      - ".github/workflows/rag-lab.yml"
      - ".gitattributes"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test and verify synthetic RAG evaluation
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/rag-lab

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/rag-lab/requirements.txt

      - name: Install test dependency
        run: python -m pip install --requirement requirements.txt

      - name: Unit tests
        run: python -m pytest

      - name: Phase 17 answer quality gate
        run: python run_rag_lab.py evaluate-answer-quality --output-name ci-answer-quality

      - name: Validate tracked synthetic baseline
        run: >-
          python run_rag_lab.py validate-baseline
          --baseline baselines/phase8-reference.json

      - name: Synthetic quality gate
        run: python run_rag_lab.py verify --report-name ci-candidate

      - name: Build safe baseline candidate
        run: >-
          python run_rag_lab.py baseline-candidate
          --source ci-candidate.json
          --output-name ci-baseline-candidate

      - name: Independent synthetic quality gate
        run: python run_rag_lab.py verify --report-name ci-reproduction

      - name: Build independent baseline candidate
        run: >-
          python run_rag_lab.py baseline-candidate
          --source ci-reproduction.json
          --output-name ci-baseline-reproduction

      - name: Review safe baseline candidate
        run: >-
          python run_rag_lab.py review-baseline
          --baseline baselines/phase8-reference.json
          --candidate ci-baseline-candidate.json
          --output-name ci-baseline-review

      - name: Check baseline candidate reproducibility
        run: >-
          python run_rag_lab.py check-reproducibility
          --first ci-baseline-candidate.json
          --second ci-baseline-reproduction.json
          --output-name ci-candidate-reproducibility

      - name: Assess baseline readiness
        run: >-
          python run_rag_lab.py baseline-readiness
          --baseline baselines/phase8-reference.json
          --candidate ci-baseline-candidate.json
          --reproduction ci-baseline-reproduction.json
          --output-name ci-baseline-readiness
